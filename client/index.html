<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <!-- The browser/shell frame color: starts at the default
         theme's background and is updated to the active theme's
         background by main.tsx (first frame) and themes.ts on
         every theme change, so the area around the app header
         holds the theme color on every page. -->
    <meta name="theme-color" content="#060913" />
    <!-- Empty inline icon: stops the browser fetching /favicon.ico, which
         lives outside the space's routes and fails auth. -->
    <link rel="icon" href="data:," />
    <title>Vault X</title>
    <script src="./src/main.tsx" type="module"></script>
  </head>
  <body>
    <div
      data-generated-space-root=""
      data-generated-space-slug="lorcana-binder"
    ></div>
  </body>
</html>
